<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Slot Machine</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #111;
        color: #fff;
    }

    h1 {
        margin-top: 20px;
    }

    .slot-container {
        margin: 30px auto;
        display: flex;
        justify-content: center;
        gap: 20px;
    }

    .slot {
        width: 80px;
        height: 80px;
        background: #222;
        border: 3px solid #555;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
    }

    button {
        padding: 10px 20px;
        font-size: 18px;
        margin-top: 20px;
        cursor: pointer;
    }

    #message {
        margin-top: 20px;
        font-size: 20px;
    }

    #tokens {
        margin-top: 10px;
        font-size: 18px;
    }
</style>
</head>
<body>

<h1>🤖 AI Token Slot Machine</h1>

<div id="tokens">Tokens: 100</div>

<div class="slot-container">
    <div class="slot" id="slot1">❓</div>
    <div class="slot" id="slot2">❓</div>
    <div class="slot" id="slot3">❓</div>
</div>

<button onclick="spin()">Spin (Cost: 10 tokens)</button>

<div id="message"></div>

<script>
let tokens = 100;

const symbols = ["🤖", "💰", "🔥", "404", "🧠"];

function spin() {
    if (tokens < 10) {
        document.getElementById("message").innerText = "You're out of tokens. AI wins.";
        return;
    }

    tokens -= 10;
    updateTokens();

    let s1 = randomSymbol();
    let s2 = randomSymbol();
    let s3 = randomSymbol();

    document.getElementById("slot1").innerText = s1;
    document.getElementById("slot2").innerText = s2;
    document.getElementById("slot3").innerText = s3;

    checkWin(s1, s2, s3);
}

function randomSymbol() {
    return symbols[Math.floor(Math.random() * symbols.length)];
}

function checkWin(a, b, c) {
    let message = "";

    if (a === b && b === c) {
        tokens += 50;
        message = "AI glitch! You win 50 tokens 🎉";
    } else if (a === b || b === c || a === c) {
        tokens += 20;
        message = "AI is confused. You win 20 tokens 😎";
    } else {
        message = "AI took your tokens. Try again 🤡";
    }

    document.getElementById("message").innerText = message;
    updateTokens();
}

function updateTokens() {
    document.getElementById("tokens").innerText = "Tokens: " + tokens;
}
</script>

</body>
</html>
